# Score one patch source on every dev task, one GitHub runner per task,
# and publish one run record per task (ADR-0011, ADR-0012), archived for
# good as RUN_ID.tar.gz in the run-records release (ADR-0017).
#
# Manual only: Actions tab -> "benchmark" -> "Run workflow".
# Never triggered automatically: from Week 2 a run spends real money.
#
# agent:simple and agent:mini (ADR-0018) call DeepSeek with the
# DEEPSEEK_API_KEY repository secret. Spending is bounded per task by the
# ADR-0014 ceiling ($0.10, the same for both agents), so one dispatch over
# the 5 dev tasks can spend at most $0.50. Only people with
# write access can dispatch, and pull requests from forks never receive
# secrets [PRIMARY — GitHub Actions docs].

name: benchmark

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Patch source"
        type: choice
        options: [gold, noop, empty, "agent:simple", "agent:mini"]
        default: gold
      run_id:
        description: "New, unique run ID (e.g. ci-gold-1)"
        required: true
      instances:
        description: "Task IDs separated by spaces, or 'all' for the whole dev split"
        default: all
      cache_bust:
        description: "agent:simple only: random marker first in every prompt, so nothing is served from cache (Week 3)"
        type: boolean
        default: false

permissions:
  contents: read
  actions: read   # to look up earlier runs' artifacts (run-ID check below)

env:
  DATASET: SWE-bench/SWE-bench_Verified
  DATASET_REVISION: 78f471bf655a3137b2e8a75af1501690ec009ec3  # ADR-0010 addendum
  # Inputs go through env, never pasted into scripts: a crafted run ID
  # cannot then become shell code (GitHub's script-injection guidance).
  SOURCE: ${{ inputs.source }}
  RUN_ID: ${{ inputs.run_id }}
  INSTANCES: ${{ inputs.instances }}
  CACHE_BUST: ${{ inputs.cache_bust }}
  # Print Python output as it happens, so log lines appear in order.
  PYTHONUNBUFFERED: "1"

jobs:
  tasks:
    name: Read the dev split
    runs-on: ubuntu-24.04
    outputs:
      ids: ${{ steps.ids.outputs.ids }}
    steps:
      - uses: actions/checkout@v5
      - name: Refuse a run ID that an earlier run already used
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Each runner starts empty, so the local "records already exist"
          # check cannot see earlier CI runs. Two places can show the ID is
          # taken, both by exact name, never prefix ("ci-gold" must not
          # collide with "ci-gold-1-..."):
          #   artifacts named RUN_ID-TASK (they expire after 90 days);
          #   asset RUN_ID.tar.gz in the run-records release (kept; ADR-0017).
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
            --jq '.artifacts[].name' > "$RUNNER_TEMP/artifact-names.txt"
          if release=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/run-records" \
                         --jq .id 2> "$RUNNER_TEMP/release.err"); then
            gh api --paginate "repos/$GITHUB_REPOSITORY/releases/$release/assets?per_page=100" \
              --jq '.[].name' > "$RUNNER_TEMP/asset-names.txt"
          elif grep -q "HTTP 404" "$RUNNER_TEMP/release.err"; then
            : > "$RUNNER_TEMP/asset-names.txt"   # no release yet, so nothing archived
          else
            cat "$RUNNER_TEMP/release.err"       # cannot tell: refuse rather than guess
            exit 1
          fi
          python3 - <<'EOF'
          import json, os, re, sys
          run_id = os.environ["RUN_ID"]
          tmp = os.environ["RUNNER_TEMP"]
          # GitHub renames asset files with special characters [PRIMARY — REST
          # docs, release assets]; a renamed archive would escape the check below.
          if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9-]*", run_id):
              print(f"::error::run ID '{run_id}' may contain only letters, digits and hyphens.")
              sys.exit(1)
          tasks = json.load(open("splits/dev_split.json"))["instance_ids"]
          names = set(open(os.path.join(tmp, "artifact-names.txt")).read().split())
          taken = sorted(n for n in (f"{run_id}-{t}" for t in tasks) if n in names)
          if taken:
              print(f"::error::run ID '{run_id}' was already used (artifact {taken[0]}). Choose a new one.")
              sys.exit(1)
          assets = set(open(os.path.join(tmp, "asset-names.txt")).read().split())
          if f"{run_id}.tar.gz" in assets:
              print(f"::error::run ID '{run_id}' was already used (archived as "
                    f"{run_id}.tar.gz in release run-records). Choose a new one.")
              sys.exit(1)
          print(f"run ID '{run_id}' is new")
          EOF
      - id: ids
        run: |
          # The split file is the only source of task IDs; a requested ID
          # outside it stops the run here, before any runner starts.
          ids=$(python3 - <<'EOF'
          import json, os, sys
          split = json.load(open("splits/dev_split.json"))["instance_ids"]
          want = os.environ.get("INSTANCES", "all").split()
          if want in ([], ["all"]):
              want = split
          outside = [i for i in want if i not in split]
          if outside:
              sys.exit(f"not in the dev split: {outside}")
          print(json.dumps([i for i in split if i in want]))
          EOF
          )
          echo "ids=$ids" >> "$GITHUB_OUTPUT"
          echo "Tasks: $ids"

  run:
    name: ${{ matrix.instance }}
    needs: tasks
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        instance: ${{ fromJSON(needs.tasks.outputs.ids) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install, and record exact package versions
        run: |
          echo "WORKDIR=$RUNNER_TEMP/bs-work" >> "$GITHUB_ENV"
          WORKDIR="$RUNNER_TEMP/bs-work"
          pip install -e .
          # agent:mini only: mini-swe-agent, pinned and without dependencies
          # (ADR-0018). Before the freeze, so pip-freeze.txt records it.
          if [ "$SOURCE" = "agent:mini" ]; then bash scripts/install_mini.sh; fi
          mkdir -p "$WORKDIR"
          pip freeze > "$WORKDIR/pip-freeze.txt"

      - name: Download the dataset at the pinned revision
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -c "from datasets import load_dataset; load_dataset('$DATASET', split='test', revision='$DATASET_REVISION')"
          ls "$HOME/.cache/huggingface/datasets/SWE-bench___swe-bench_verified/default/0.0.0/"

      - name: Run
        env:
          # Only this step sees the key, and only agent sources use it.
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          bust=""
          if [ "$CACHE_BUST" = "true" ]; then bust="--cache-bust"; fi
          python -m blindspots.run --run-id "$RUN_ID" --source "$SOURCE" \
            --instances "${{ matrix.instance }}" --workdir "$WORKDIR" $bust

      - name: Upload record, harness logs and package versions
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.RUN_ID }}-${{ matrix.instance }}
          path: |
            ${{ runner.temp }}/bs-work/records/
            ${{ runner.temp }}/bs-work/logs/
            ${{ runner.temp }}/bs-work/harness.*.out
            ${{ runner.temp }}/bs-work/pip-freeze.txt
            ${{ runner.temp }}/bs-work/preds.*.jsonl
            ${{ runner.temp }}/bs-work/crashes/
          retention-days: 90

  summary:
    name: Summary
    needs: [tasks, run]
    # Even if some tasks failed, but not after a refused run ID: then this
    # run produced nothing to summarise or archive.
    if: always() && needs.tasks.result == 'success'
    runs-on: ubuntu-24.04
    # The only job that can write: it creates the run-records release and
    # uploads to it (ADR-0017). Job permissions replace the workflow's, so
    # actions: read is repeated for downloading this run's artifacts.
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -e .
      - uses: actions/download-artifact@v6
        with:
          pattern: ${{ env.RUN_ID }}-*
          path: collected
          merge-multiple: true
      - name: Re-validate every record and publish the table
        run: |
          python -m blindspots.summarise collected/records | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Archive the run for good (release run-records, ADR-0017)
        # Runs only if every record re-validated above. The same script
        # backfills older runs, so every archive is built the same way:
        # one folder per task, as the artifacts were uploaded. (collected/
        # cannot be used: merging gives every task's pip-freeze.txt,
        # harness.RUN_ID.out and preds file the same name, keeping one.)
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/archive_ci_run.sh "$GITHUB_RUN_ID" "$RUN_ID"
