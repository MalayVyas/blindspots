[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blindspots"
version = "0.1.0"
description = "Role-level cost benchmark for multi-agent coding pipelines"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",    # provider adapters: ADR-0013
    "pydantic>=2.7,<3",
    "swebench==5.0.2",   # pinned: ADR-0010
]

[project.optional-dependencies]
dev = ["pytest>=8"]

# Find subpackages too (blindspots.providers, blindspots.agent). The old
# explicit list named only the top package, which a non-editable install
# would have shipped without its subpackages.
[tool.setuptools.packages.find]
include = ["blindspots*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
