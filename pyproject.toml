[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blindspots"
version = "0.1.0"
description = "Role-level cost benchmark for multi-agent coding pipelines"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
    "swebench==5.0.2",   # pinned: ADR-0010
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["blindspots"]

[tool.pytest.ini_options]
testpaths = ["tests"]
